# ============================================================================
#  Deal-Watcher – Einstellungen und Suchbegriffe
#  Aenderungen hier wirken beim naechsten Lauf. Zeilen mit # sind Kommentare.
# ============================================================================

[einstellungen]
min_rabatt_prozent   = 20     # mind. so viel % unter dem Marktpreis (Median)
min_spielraum_eur    = 20     # und mind. so viele Euro Luft fuer den Weiterverkauf
zu_billig_prozent    = 35     # unter 35 % des Marktpreises = vermutlich falscher Artikel/Fake -> ignorieren
min_vergleiche       = 6      # so viele Vergleichsanzeigen braucht ein verlaesslicher Marktpreis
nur_mit_versand      = true   # reine Abholer-Angebote nicht melden
hochpreis_eur        = 150    # ab diesem Preis nur mit etabliertem Verkaeufer ODER "Direkt kaufen" (Kaeuferschutz)
min_bewertung        = 4      # Angebote unter dieser Bewertung (1-10) nicht melden
max_detailpruefungen = 12     # Anzeigenseiten, die pro Lauf genauer geprueft werden
noname_melden        = false  # Stufe C (No-Name/China-Billigware, siehe marken.toml) melden? Empfehlung: nein
b_mit_a_vergleichen  = true   # Mittelklasse (Stufe B) darf mit Markenware (A) verglichen werden, wenn B zu wenige Vergleiche hat
b_abschlag_prozent   = 15     # ... dann aber mit diesem Abschlag auf den Markenware-Marktpreis
soft_abzug           = 2      # Punkte Abzug, wenn die Beschreibung unklare Hinweise enthaelt (z. B. "Reparatur", "Geraeusche")
max_neue_suchen_pro_lauf = 8  # neue Suchen bauen ihre Preisbasis verteilt auf mehrere Laeufe auf (schont kleinanzeigen)
pause_min_s          = 1.5    # Pause zwischen Seitenabrufen (hoeflich bleiben, nicht gesperrt werden)
pause_max_s          = 3.5

# ----------------------------------------------------------------------------
#  Suchbegriffe
#   begriff    = Suchtext wie im kleinanzeigen-Suchfeld
#   kategorie  = "pc-zubehoer" (Festplatten, SSD, RAM, GPU, CPU), "pcs" (Server, Mini-PCs) oder weglassen
#   muss       = diese Muster muessen im Titel stehen (Regex, Gross/Klein egal)
#   nicht      = Titel mit diesen Mustern werden ignoriert
#   preis_min/preis_max = alles ausserhalb ist Zubehoer, Fehlpreis o.ae.
#   alle       = nur jeden n-ten Lauf pruefen (spart Abrufe bei selten ergiebigen Suchen)
#   eigenbedarf = true -> kein Mindest-Spielraum noetig (fuer dein EliteBook)
#   mengen_erlaubt = true -> Titel wie "2x16GB" nicht als Sammelanzeige aussortieren
#   gruppe     = Produktgruppe aus marken.toml (ram, ssd, hdd, nas, server, gpu, cpu, laptop, minipc, psu):
#                schaltet Marken-Stufen, getrennte Marktpreise und Fake-Mindestpreise ein. Ohne gruppe gilt wie frueher ein Topf.
#   noname_melden = true -> bei dieser Suche auch Stufe C melden (Standard: aus config oben)
#   eigenbedarf_hinweis = kurzer Text fuer die Mail bei Eigenbedarf-Suchen
#   modus = "preisgrenze" -> kein Marktpreis-Vergleich (fuer Konvolute und Laptops mit einfachem Makel):
#       gemeldet wird jede neue Anzeige bis melden_bis (Euro), nach der ueblichen Verkaeufer-/Maengelpruefung.
#       richtwert = realistischer Wiederverkaufswert nach dem Aufwerten (optional, dann wird der Spielraum berechnet)
#       aufwertung_eur = was das Aufwerten kostet (z. B. SSD + Netzteil), wird vom Spielraum abgezogen
#       bewertung = feste Bewertung, wenn kein richtwert angegeben ist (Standard 6)
#       hinweis = Text, der in der Mail beim Treffer steht
# ----------------------------------------------------------------------------


# ============================================================================
#  Marken und Qualitaetsstufen
#  Der Deal-Watcher vergleicht Preise NUR innerhalb derselben Stufe und meldet Stufe C (und
#  Anzeigen ohne erkennbare Marke, wenn die Gruppe "unbekannt = C" hat) standardmaessig nicht.
#
#   Stufe A = etablierte Markenhersteller          (Crucial, Samsung, ThinkPad, Synology ...)
#   Stufe B = akzeptable Mittelklasse / OEM          (Lexar, Ramaxel, Acer, Beelink ...)
#   Stufe C = No-Name / China-Billigware             (Fanxiang, KingSpec, Chuwi ...)
#
#  Regeln zur Stufenbestimmung (in dieser Reihenfolge):
#   1. Steht ein Name aus C im Titel -> Stufe C (eine Billigmarke entwertet die Anzeige).
#   2. modell_A / modell_B = Modellreihen, die schon allein die Stufe festlegen (z. B. "thinkpad" = A).
#   3. Sonst gilt der Markenname aus A oder B, der im Titel zuerst steht.
#   4. Sonst "unbekannt": die Stufe steht in der Zeile  unbekannt = "B" oder "C".
#
#  Alle Eintraege sind Suchmuster (Regex, Gross/Klein egal, Umlaute egal). Marken-Eintraege (A, B, C) muessen als
#  ganzes Wort im Titel stehen; modell_A/modell_B duerfen Ziffern direkt anhaengen (z. B. 'rtx\s?\d{4}').
#  Backslashes immer in einfachen Anfuehrungszeichen ('...') schreiben.
#
#  ignoriere = Mangel-Regeln, die fuer diese Gruppe normal sind (z. B. NAS werden ohne Festplatten verkauft).
# ============================================================================

# ----------------------------------------------------------------- Arbeitsspeicher
[gruppe.ram]
unbekannt = "B"      # viele private Riegel sind unbeschriftete Laptop-Ausbauten (meist Samsung/Hynix/Micron)
A = ['crucial', 'samsung', 'sk\s?hynix', 'hynix', 'micron', 'kingston', 'corsair', 'g\.?\s?skill', 'patriot',
     'team\s?group', 'teamgroup', 'adata', 'xpg', 'mushkin', 'hyperx', 'fury', 'vengeance', 'ripjaws', 'trident',
     'dominator', 'viper']
B = ['lexar', 'ramaxel', 'silicon\s?power', 'transcend', 'pny', 'apacer', 'goodram', 'nanya', 'gloway', 'kingmax',
     'v-?color', 'oloy']
C = ['fanxiang', 'kingspec', 'walram', 'netac', 'hikvision', 'hiksemi', 'kllisre', 'aiwanlily', 'zifei', 'biwintech',
     'maxsun', 'no\s?name', 'noname', 'ohne\s+marke', 'china']


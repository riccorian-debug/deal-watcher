name: Deal-Watcher

on:
  schedule:
    # stündlich von ca. 7 bis 23 Uhr deutscher Zeit (Angabe in UTC)
    - cron: "17 5-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: deal-watcher
  cancel-in-progress: false

jobs:
  suche:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Angebote suchen
        run: python deal_watcher.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Merkliste speichern
        if: always()
        run: |
          git config user.name "deal-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Merkliste aktualisiert"
            git pull --rebase
            git push
          fi
